spring:

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${BD_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update # Poner 'create' la primera vez que lo instancies a tu base de datos, o 'update' si hay ligeros cambios, ya después dejar 'validate'
    defer-datasource-initialization: true

